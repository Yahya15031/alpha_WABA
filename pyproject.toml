[project]
name = "meta-integration"
version = "0.1.0"
description = "Multi-tenant B2B WhatsApp Business API SaaS platform"
requires-python = ">=3.11,<3.14"

dependencies = [
    # Web framework
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",

    # DB layer
    "sqlalchemy[asyncio]>=2.0.36",
    "psycopg[binary,pool]>=3.2.0",
    "greenlet>=3.0.0",
    "alembic>=1.14.0",

    # Queue (Phase 1 arch decision: arq for async-native Redis workers)
    "arq>=0.26.1",
    "redis>=5.2.0",

    # Config + validation
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",

    # Auth (JWT verification for Supabase tokens)
    "pyjwt[crypto]>=2.10.0",

    # HTTP client for Meta Cloud API (used in later turns)
    "httpx>=0.28.0",

    # CSV ingestion (used in later turns)
    "python-multipart>=0.0.19",

    # Load .env in dev / on Windows where the shell doesn't auto-load it
    "python-dotenv>=1.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.7.0",
    "mypy>=1.13.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
