# Env vars are defined once in a shared group and referenced by every service.
# Set each key manually in Render Dashboard → Environment Groups → alpha-waba-shared.
envVarGroups:
  - name: alpha-waba-shared
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: MIGRATION_DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_JWT_SECRET
        sync: false
      - key: REDIS_URL
        sync: false
      - key: META_ACCESS_TOKEN
        sync: false
      - key: META_APP_SECRET
        sync: false
      - key: META_WEBHOOK_VERIFY_TOKEN
        sync: false
      - key: ALLOWED_CORS_ORIGINS
        sync: false
      - key: APP_ENV
        value: production
      - key: LOG_LEVEL
        value: INFO
      - key: PYTHONUNBUFFERED
        value: "1"

services:
  # ------------------------------------------------------------------
  # Web service — FastAPI app (public URL)
  # ------------------------------------------------------------------
  - type: web
    name: alpha-waba-api
    runtime: python
    plan: free
    region: singapore
    branch: main
    buildCommand: pip install -e .
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    envVars:
      - fromGroup: alpha-waba-shared

  # ------------------------------------------------------------------
  # Worker — transactional lane (webhook processing, OTP-style sends)
  # Render background workers require a paid plan ($7/mo).
