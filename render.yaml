services:
  - type: web
    name: alpha-waba-api
    runtime: python
    plan: free
    region: singapore  # same region as your Supabase + Upstash — keeps latency down
    branch: main
    buildCommand: pip install -e .
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz

    envVars:
      # Postgres — set in Render dashboard (secrets)
      - key: DATABASE_URL
        sync: false
      - key: MIGRATION_DATABASE_URL
        sync: false

      # Supabase auth
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_JWT_SECRET
        sync: false

      # Upstash Redis
      - key: REDIS_URL
        sync: false

      # Meta Cloud API
      - key: META_ACCESS_TOKEN
        sync: false
      - key: META_APP_SECRET
        sync: false
      - key: META_WEBHOOK_VERIFY_TOKEN
        sync: false

      # CORS — comma-separated origins (frontend URL, Figma preview, localhost)
      - key: ALLOWED_CORS_ORIGINS
        sync: false

      # Fixed config
      - key: APP_ENV
        value: production
      - key: LOG_LEVEL
        value: INFO
      - key: PYTHONUNBUFFERED
        value: "1"
